$font = JetBrainsMono Nerd Font
$wallpaper = ~/.config/colorschemes/rosepine/wallpapers/wallpapersden.com_frieren-hd-frieren-beyond-journey-s-end_1920x1080.jpg

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper
    blur_size = 3
    blur_passes = 1
}

input-field {
    monitor =
    size = 25%, 5%
    outline_thickness = 2

    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgb(156, 207, 216)

    check_color = rgb(156, 207, 216)
    fail_color = rgb(235, 111, 146)

    font_color = rgb(224, 222, 244)

    fade_on_empty = false
    rounding = 2

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL
    check_text = Authenticating...

    dots_spacing = 0.3
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font
    font_color = rgb(144, 140, 170)

    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = 
    font_size = 24
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
